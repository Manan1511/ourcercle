<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38.38 -25.67 1076.32 1076.32">
  <!-- Cercle mark for the browser tab: the ring alone, no wordmark and no
       background. The full lockup's lettering collapses into a smudge at the
       16px a tab actually renders; the ring stays legible all the way down.

       A single fixed colour cannot work on both tab strips, so the fill follows
       the UA colour scheme. Browsers that ignore the query get the wine, which
       is the safer default on a white strip. -->
  <style>
    .mark { fill: #471224; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #F7EEC7; }
    }
  </style>

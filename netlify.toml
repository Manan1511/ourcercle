[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Pre-launch paths, retired when the OurCercle IA landed.
[[redirects]]
  from = "/about"
  to = "/story"
  status = 301

[[redirects]]
  from = "/services"
  to = "/cercles"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/invite"
  status = 301

# The site is prerendered, so every route already exists as a real HTML file
# and Netlify serves it directly. This fallback only catches paths with no
# matching file, handing them to the SPA so the 404 route renders -- with a
# 404 status, so crawlers are told the truth.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

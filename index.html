<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first: it is sharp at every size and adapts to the tab strip's
         colour scheme. The PNG is the fallback for browsers that ignore it. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page <title> and meta tags are injected at build time by src/components/Seo.tsx -->
  </head>
  <body>
    <script>
      /* Hide the homepage until the intro curtain is up, so there is no flash
         of content before it mounts. Runs before first paint. The timeout is a
         failsafe: if hydration never happens, the page must not stay hidden. */
      (function () {
        try {
          var p = location.pathname
          if (p === '/' || p === '/index.html') {
            var d = document.documentElement
            d.setAttribute('data-intro', 'pending')
            setTimeout(function () { d.removeAttribute('data-intro') }, 5000)
          }
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
